<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Presidential Election Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617; /* Slate 950 */
            color: #e2e8f0;
            margin: 0;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-panel-hover:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(148, 163, 184, 0.3);
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-in-out;
        }
        .ui-high-risk {
            --risk-glow-color: rgba(220, 38, 38, 0.5);
            box-shadow: inset 0 0 20px 10px var(--risk-glow-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop-fade {
            0% { transform: translateY(0) scale(0.9); opacity: 1; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.1); opacity: 0; }
        }
        .animate-pop-fade {
            animation: pop-fade 1.5s ease-out forwards;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(220, 38, 38, 0.3); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
            50% { border-color: rgba(220, 38, 38, 0.7); box-shadow: 0 0 10px 3px rgba(220, 38, 38, 0.1); }
        }
        .animate-pulse-border {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border-heavy {
            0%, 100% { border-color: #ef4444; }
            50% { border-color: #f87171; }
        }
        .animate-pulse-border-heavy {
             animation: pulse-border-heavy 1.5s infinite;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1); 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15); 
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.25); 
        }

        /* Dice Roll Animations */
        @keyframes rollIn {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-roll-in { animation: rollIn 0.3s ease-out forwards; }
        
        @keyframes resultPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-result-pop { animation: resultPop 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        @keyframes number-flicker {
            0% { opacity: 0.8; text-shadow: 0 0 5px currentColor; }
            50% { opacity: 1; text-shadow: 0 0 15px currentColor; }
            100% { opacity: 0.8; text-shadow: 0 0 5px currentColor; }
        }
        .animate-number-flicker { animation: number-flicker 1.5s infinite; }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-slide-up {
            animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Stat Change Animations */
        @keyframes flash-green {
            0% { background-color: rgba(74, 222, 128, 0); }
            50% { background-color: rgba(74, 222, 128, 0.3); }
            100% { background-color: rgba(74, 222, 128, 0); }
        }
        .animate-flash-green { animation: flash-green 0.7s ease-out; }

        @keyframes flash-red {
            0% { background-color: rgba(248, 113, 113, 0); }
            50% { background-color: rgba(248, 113, 113, 0.3); }
            100% { background-color: rgba(248, 113, 113, 0); }
        }
        .animate-flash-red { animation: flash-red 0.7s ease-out; }

        @keyframes flash-gold {
            0% { background-color: rgba(250, 204, 21, 0); }
            50% { background-color: rgba(250, 204, 21, 0.3); }
            100% { background-color: rgba(250, 204, 21, 0); }
        }
        .animate-flash-gold { animation: flash-gold 0.7s ease-out; }

        @keyframes flash-blue {
            0% { background-color: rgba(96, 165, 250, 0); }
            50% { background-color: rgba(96, 165, 250, 0.3); }
            100% { background-color: rgba(96, 165, 250, 0); }
        }
        .animate-flash-blue { animation: flash-blue 0.7s ease-out; }
        
        @keyframes pulse-red-bg {
            0% { background-color: rgba(239, 68, 68, 0.3); }
            50% { background-color: rgba(239, 68, 68, 0.5); }
            100% { background-color: rgba(239, 68, 68, 0.3); }
        }
        .animate-pulse-red { animation: pulse-red-bg 1s ease-in-out; }

        @keyframes critical-glow {
            0%, 100% { box-shadow: 0 0 25px 3px rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 35px 8px rgba(220, 38, 38, 0.6); }
        }
        .animate-critical-glow { animation: critical-glow 1.5s infinite; }

        @keyframes stat-pop-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-25px) scale(0.8); }
        }
        .animate-stat-pop-up { animation: stat-pop-up 1s ease-out forwards; }

    </style>
<script type="importmap">

}
</script>
</head>
